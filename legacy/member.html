<body data-page="member">
<div class="app">

  <header class="hdr">
    <button class="icon-btn" data-drawer aria-label="menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h12M4 17h16"/></svg>
    </button>
    <div class="logo"><span class="logo__mark"><i class="tk">TK</i><i class="num">420</i></span><span class="logo__sub">bet</span></div>
    <div class="hdr__actions">
      <button class="btn btn--ghost" data-auth="login">Login</button>
      <button class="btn btn--gold" data-auth="register">Register</button>
    </div>
  </header>

  <div class="profile">
    <div class="profile__av">🙂</div>
    <div>
      <div class="profile__n">Guest User</div>
      <div class="profile__id">ID: 000000 · Not logged in</div>
    </div>
    <div class="profile__bal">
      <b>৳0.00</b>
      <small>Main wallet</small>
    </div>
  </div>

  <div class="quick" style="margin:0 12px 12px">
    <a href="#" data-toast="Deposit — demo"><i class="ico">💰</i>Deposit</a>
    <a href="#" data-toast="Withdraw — demo"><i class="ico">💸</i>Withdraw</a>
    <a href="#" data-toast="Transfer — demo"><i class="ico">🔄</i>Transfer</a>

  </div>

  <div class="list-card">
    <a href="#" data-toast="Betting record — demo"><i class="e">📊</i>Betting Record<i class="arrow">›</i></a>
    <a href="#" data-toast="Transaction record — demo"><i class="e">🧾</i>Transaction Record<i class="arrow">›</i></a>
    <a href="reward.html"><i class="e">🎁</i>Reward Center<i class="arrow">›</i></a>
    <a href="invite.html"><i class="e">👥</i>Invite Friends<i class="arrow">›</i></a>
    <a href="promotion.html"><i class="e">🔥</i>Promotions<i class="arrow">›</i></a>

    <a href="#" data-toast="Language — demo"><i class="e">🌐</i>Language · English<i class="arrow">›</i></a>
    <a href="#" data-toast="App download — demo"><i class="e">📱</i>App Download<i class="arrow">›</i></a>
    <a href="#" data-toast="Live chat — demo"><i class="e">🎧</i>Customer Service<i class="arrow">›</i></a>
    <a href="#" data-toast="Help — demo"><i class="e">❓</i>Help Center<i class="arrow">›</i></a>

    <button class="btn btn--gold btn--block" data-auth="login">Login / Register</button>
